  { "Research notes" = [
    { "research notes and ranked ideas" = "research/dfthcsos.md" },
    { "ranked ideas" = "research/dqi.md" },
    { "literature and public-notebook research" = "research/invsqrt.md" },
    { "kickmix-engine source audit" = "research/kickmix-engine-audit.md" },
    { "kickmix-engine parity with the official verifier" = "research/kickmix-engine-parity.md" },
    { "Static audit of syed3000's DQI builder source tree (read-onl" = "research/syed-dqi-audit.md" },
    { "andigu/uncompute `coulomb-potential` and the public 46-qubit" = "research/uncompute-coulomb.md" },
    { "Workflows and methods: what to adopt in the last 60 days" = "research/workflows.md" },
  ] },
  { "Decisions (ADRs)" = [
    { "0001: Every candidate is scored by the official verifier and promo" = "adr/0001-verify-with-official-verifier-and-multi-seed-margin.md" },
    { "0002: Heavy DQI verification runs on a Kaggle notebook first, RunP" = "adr/0002-heavy-dqi-runs-on-kaggle-first-runpod-fallback.md" },
    { "0003: Hybrid strategy: cheapest ratio gains first, per-task prizes" = "adr/0003-hybrid-strategy-ratcheted-valid-submissions.md" },
    { "0004: Public Apache-2.0 repository and a public reproducibility no" = "adr/0004-public-apache-2-repo-and-reproducible-notebook.md" },
    { "0005: No custom agent orchestrator; invest in the verification har" = "adr/0005-no-custom-agent-orchestrator-harness-only.md" },
    { "0006: A learning track delivered as markdown plus a Zensical site," = "adr/0006-learning-track-as-zensical-docs-site.md" },
    { "0007: Start from public circuits, then spend effort where others h" = "adr/0007-start-from-public-circuits-then-explore-unclaimed-directions.md" },
    { "0008: Ledger v2, worst-salt ranking, and an in-repo indah dashboar" = "adr/0008-measurement-ledger-v2-and-dashboard.md" },
    { "0009: Our own generators, paper first, then study and rewrite" = "adr/0009-own-generators-paper-first-then-study-and-rewrite.md" },
  ] },
  { "Reference" = [
    { "Handoff" = "HANDOFF.md" },
    { "Provenance" = "PROVENANCE.md" },
    { "Competition rules" = "COMPETITION_RULES.md" },
    { "Slices" = "SLICES.md" },
    { "Questions" = "QUESTIONS.md" },
    { "Dashboard gaps" = "DASHBOARD_GAPS.md" },
  ] },
]

# MathJax 3 (SVG output, one file, no font downloads, so it works offline). Vendored from npm mathjax@3.2.2.
extra_javascript = ["javascripts/mathjax.js", "javascripts/tex-svg.js"]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
