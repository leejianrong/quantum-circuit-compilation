[project]
site_name = "Quantum circuit compilation: learning track"
site_description = "A newcomer curriculum for the Verifiable Quantum Circuit Compilation competition"
site_url = "https://leejianrong.github.io/quantum-circuit-compilation/"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true

# Every page under docs/learn/ is listed here. The build tolerates a listed page that does not
# exist yet (it prints a warning and exits 0), so pages can land in any order.
nav = [
  { "Start here" = "index.md" },
  { "Learning track" = "learn/index.md" },
  { "Foundations" = [
    { "Qubits and gates" = "learn/qubits-and-gates.md" },
    { "Reversible logic" = "learn/reversible-logic.md" },
  ] },
  { "The competition's ideas" = [
    { "Costs and MBUC" = "learn/costs-and-mbuc.md" },
    { "Classical verification" = "learn/classical-verification.md" },
  ] },
  { "Benchmark primers" = [
    { "invsqrt" = "learn/primer-invsqrt.md" },
    { "dqi" = "learn/primer-dqi.md" },
    { "dfthcsos" = "learn/primer-dfthcsos.md" },
  ] },
  { "Hands-on kickmix" = "learn/kickmix-hands-on.md" },
  { "Glossary" = "learn/glossary.md" },
  { "Competition" = "COMPETITION.md" },
  { "Plan" = "PLAN.md" },
  { "Measurement and dashboard" = "MEASUREMENT.md" },
  { "Log book" = [
    { "Timeline" = "log/index.md" },
    { "Entry template" = "log/template.md" },
    { "By benchmark" = "log/by-benchmark.md" },
    { "By method" = "log/by-method.md" },
    { "Negative results" = "log/negative-results.md" },
    { "Corrections" = "log/corrections.md" },
  ] },
  { "Results" = [
    { "Scoreboard" = "results/scoreboard.md" },
    { "Experiments" = "results/experiments.md" },
  ] },
  { "Studies: invsqrt" = [
    { "split phase, serial phasing and a centered remainder" = "experiments/invsqrt-bitserial.md" },
    { "where the cost goes" = "experiments/invsqrt-cost-drivers.md" },
    { "our own generator" = "experiments/invsqrt-generator.md" },
    { "running the 62-qubit frontier and reading its registers" = "experiments/invsqrt-onepass.md" },
    { "phase adder, signed-digit rows, lazy allocation" = "experiments/invsqrt-phase-adder.md" },
    { "the 46-qubit design re-derived" = "experiments/invsqrt-sqrt-division.md" },
    { "what the 62-qubit frontier is made of" = "experiments/invsqrt-stage2.md" },
    { "decoding syed3000's 46-qubit builder" = "experiments/invsqrt-syed-decode.md" },
    { "uncompute, lean qubits and exhaustive windows" = "experiments/invsqrt-uncompute.md" },
  ] },
  { "Studies: dqi" = [
    { "a dialog-free Berlekamp-Massey decoder" = "experiments/dqi-bm.md" },
    { "where the host reference spends its cost" = "experiments/dqi-cost-drivers.md" },
    { "our own divstep decoder, first version" = "experiments/dqi-divstep-v0.md" },
    { "Lanczos decoder failures and Toffoli cuts" = "experiments/dqi-failures.md" },
    { "our `fixed` circuit (65.77x) against syed3000's (67.4x)" = "experiments/dqi-gap-survey.md" },
    { "a dialog-free key-equation solver" = "experiments/dqi-inplace.md" },
    { "look-ahead analysis and Lanczos trims" = "experiments/dqi-lookahead.md" },
    { "the reciprocal-polynomial scan, design and classical prototype" = "experiments/dqi-psi.md" },
    { "cutting qubits in our own divstep decoder" = "experiments/dqi-qubits.md" },
    { "DQI small-field instances" = "experiments/dqi-small-instances.md" },
    { "what the 892-qubit circuit's structure says" = "experiments/dqi-stage2.md" },
    { "how the 889-qubit builder is put together, and where our 2.1% is" = "experiments/dqi-syed-decode.md" },
    { "the 889-qubit architecture, re-derived" = "experiments/dqi-syed.md" },
  ] },
  { "Studies: dfthcsos" = [
    { "co-design the table and the loader" = "experiments/dfthcsos-codesign.md" },
    { "dfthcsos cost model" = "experiments/dfthcsos-cost-model.md" },
    { "can our own table reach 8 bits?" = "experiments/dfthcsos-eight-bit.md" },
    { "our own angle loader" = "experiments/dfthcsos-loader.md" },
    { "fewer than 8 bits per angle word" = "experiments/dfthcsos-low-brot.md" },
    { "public ideas, our own seed" = "experiments/dfthcsos-stage2.md" },
    { "our own table passes the gates (M1) and the road to the fron" = "experiments/dfthcsos-structured.md" },
    { "decoding syed3000's 11.31x circuit, and whether to start fro" = "experiments/dfthcsos-syed-decode.md" },
