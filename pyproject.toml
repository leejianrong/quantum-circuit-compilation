[project]
name = "qcc-bench"
version = "0.1.0"
description = "Harness for the Google Quantum AI verifiable circuit compilation competition"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "kickmix>=1.0.0",
]

[project.scripts]
bench = "bench.cli:main"

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
shots = ["playwright==1.62.0"]  # dashboard screenshots for `make plots-readme`; needs `playwright install chromium`
dashboard = ["indah[plot]>=0.13.0"]

# Where indah comes from. Chart step series, log scales, rules/bands/markers and Slider readout/marks
# (indah PRs 328 and 329) are on indah main but not on PyPI yet, so the dashboard extra is pinned to a
# commit. To go back to PyPI: delete this table, bump the floor in the extra above to the release that
# has those features, and run `uv lock`.
[tool.uv.sources]
indah = { git = "https://github.com/leejianrong/indah", rev = "2ca67ec91ca8350556d4db5ea77c2124c419e637" }

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pytest-cov",
    "zensical>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench", "src/dfthcsos_model", "src/dqi_gen", "src/invsqrt_gen"]

[tool.ruff]
line-length = 110
src = ["src", "tests", "."]
extend-exclude = [".claude", "third_party", "src/dqi_gen/rs"]  # agent worktrees; vendored Apache-2.0 code kept as ported

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "dashboard"]
exclude = ["src/dqi_gen/rs/", "third_party/"]

[[tool.mypy.overrides]]
module = ["indah", "indah.*", "starlette", "starlette.*"]
ignore_missing_imports = true  # the dashboard extra is optional

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs kickmix and the competition data (run on a machine/Kaggle image that has them)"]
addopts = "-m 'not integration'"
