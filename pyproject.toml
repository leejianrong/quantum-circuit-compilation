[project]
name = "qcc-bench"
version = "0.1.0"
description = "Harness for the Google Quantum AI verifiable circuit compilation competition"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "kickmix>=1.0.0",
]

[project.scripts]
bench = "bench.cli:main"

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pytest-cov",
    "zensical>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench", "src/dfthcsos_model", "src/dqi_gen"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
extend-exclude = [".claude"]  # agent worktrees live here and must not be linted from the main checkout

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs kickmix and the competition data (run on a machine/Kaggle image that has them)"]
addopts = "-m 'not integration'"
